<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAVAC — Acceso Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --p: #1B5E20; /* Sincronizado con landing */
            --bg: #F7F4EF;
            --p-dark: #0f3324;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            /* Textura de grano premium */
            background-image: url("https://www.transparenttextures.com/patterns/felt.png");
            background-attachment: fixed;
        }

        .split-container { display: grid; grid-template-columns: 1.1fr 0.9fr; min-height: 100vh; }

        /* Fondo Cinemático con Overlay de Lujo */
        .visual-side {
            background: linear-gradient(135deg, rgba(20, 54, 33, 0.85) 0%, rgba(15, 23, 42, 0.95) 100%),
                        url('https://images.unsplash.com/photo-1545465241-ac4d5285fb7f?q=80&w=2000&auto=format&fit=crop');
            background-size: cover; background-position: center;
            display: flex; align-items: center; padding: 10%; color: white;
            position: relative; overflow: hidden;
        }

        /* Efecto de luz Glimmer en el fondo */
        .visual-side::before {
            content: ''; position: absolute; top: -10%; left: -10%; width: 70%; height: 70%;
            background: radial-gradient(circle, rgba(110, 231, 183, 0.15) 0%, transparent 70%);
            filter: blur(100px);
            pointer-events: none;
        }

        .visual-side::after {
            content: ''; position: absolute; bottom: -10%; right: -10%; width: 50%; height: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, transparent 70%);
            filter: blur(80px);
            pointer-events: none;
        }

        .form-side {
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 12%;
            position: relative;
            z-index: 10;
            box-shadow: -40px 0 80px rgba(0,0,0,0.08);
        }

        .serif { font-family: 'DM Serif Display', serif; }
        .input-pro {
            width: 100%;
            padding: 20px 24px;
            border-radius: 20px;
            border: 1px solid #E2E8F0;
            background: #F8FAFC;
            transition: all 0.4s ease;
            font-size: 15px;
            font-weight: 500;
        }
        .input-pro:focus {
            border-color: var(--p);
            background: white;
            box-shadow: 0 0 0 6px rgba(27, 94, 32, 0.08);
            outline: none;
            transform: translateY(-2px);
        }

        .btn-elite {
            width: 100%;
            background: var(--p);
            color: white;
            padding: 22px;
            border-radius: 20px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            border: none;
            cursor: pointer;
            box-shadow: 0 20px 40px rgba(20, 54, 33, 0.2);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-size: 12px;
        }
        .btn-elite:hover {
            transform: translateY(-6px) scale(1.01);
            background: #2E7D32;
            box-shadow: 0 30px 60px rgba(20, 54, 33, 0.3);
        }

        .role-card {
            border: 2px solid #F1F5F9;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .role-card:hover { border-color: #CBD5E1; background: #F8FAFC; }
        input[type="radio"]:checked + .role-card {
            border-color: var(--p);
            background: #F0FDF4;
            box-shadow: 0 10px 20px rgba(27, 94, 32, 0.05);
        }

        @media (max-width: 1100px) {
            .split-container { grid-template-columns: 1fr; }
            .visual-side { display: none; }
            .form-side { padding: 80px 10%; box-shadow: none; }
        }
    </style>
</head>
<body>

    <div class="split-container">
        <div class="visual-side">
            <div style="position: relative; z-index: 2;">
                <div style="width: 80px; height: 2px; background: #10B981; margin-bottom: 40px;"></div>
                <h1 class="serif" style="font-size: 80px; line-height: 0.95; margin-bottom: 24px;">GAVAC <br><em style="color: #6EE7B7;">Elite Suite.</em></h1>
                <p style="font-size: 20px; color: #94A3B8; max-width: 500px; line-height: 1.6;">La infraestructura digital de mayor precisión para el sector ganadero global. Datos inmutables, control absoluto.</p>
            </div>
        </div>

        <div class="form-side">
            <div style="max-width: 420px; width: 100%;">
                <div style="width: 60px; height: 60px; background: #1B5E20; border-radius: 15px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 28px; margin-bottom: 48px; box-shadow: 0 15px 30px rgba(27, 94, 32, 0.2);">G</div>
                <h2 class="serif" style="font-size: 42px; margin-bottom: 8px;">Autenticación</h2>
                <p style="color: #64748B; font-weight: 500; margin-bottom: 48px;">Identifíquese para acceder al centro de comando.</p>

                <form id="loginForm" class="space-y-8">
                    <div style="margin-bottom: 24px;">
                        <label style="display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; color: #94A3B8; letter-spacing: 2px; margin-bottom: 12px;">ID de Correo</label>
                        <input type="email" id="email" required class="input-pro" placeholder="usuario@gavac.pro">
                    </div>

                    <div id="roleSelectorContainer" style="display:none; margin-bottom: 32px;">
                        <label style="display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; color: #1B5E20; letter-spacing: 2px; margin-bottom: 12px;">Cargo Operativo</label>
                        <div style="display: grid; grid-gap: 12px; grid-template-columns: 1fr 1fr;">
                            <label><input type="radio" name="rol" value="admin" checked style="display:none"><div class="role-card"><span style="font-size: 20px;">🛡️</span><p style="font-size: 10px; font-weight: 900; margin-top: 5px;">ADMIN</p></div></label>
                            <label><input type="radio" name="rol" value="ganadero" style="display:none"><div class="role-card"><span style="font-size: 20px;">👨‍🌾</span><p style="font-size: 10px; font-weight: 900; margin-top: 5px;">PROPIETARIO</p></div></label>
                        </div>
                    </div>

                    <div style="margin-bottom: 32px;">
                        <label style="display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; color: #94A3B8; letter-spacing: 2px; margin-bottom: 12px;">Clave Maestra</label>
                        <input type="password" id="password" required class="input-pro" placeholder="••••••••">
                    </div>

                    <button type="submit" id="submitBtn" class="btn-elite">Sincronizar Acceso</button>
                </form>

                <div style="margin-top: 40px; text-align: center;">
                    <a href="#" id="toggleMode" style="color: #1B5E20; font-weight: 800; text-decoration: none; font-size: 12px; letter-spacing: 1px; border-bottom: 2px solid rgba(27, 94, 32, 0.1); padding-bottom: 4px;">SOLICITAR ALTA DE USUARIO</a>
                </div>
                <div id="loginMessage" style="display:none; margin-top: 30px; padding: 20px; border-radius: 12px; text-align: center; font-weight: 700; font-size: 13px;"></div>
            </div>
        </div>
    </div>

    <script type="module" src="/static/dist/modules/auth/main.js"></script>
</body>
</html>
