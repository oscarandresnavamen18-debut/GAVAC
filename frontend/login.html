<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAVAC — Acceso</title>
    <link rel="stylesheet" href="dist/output.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .login-split { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
        .visual-side {
            background: linear-gradient(rgba(26, 58, 50, 0.6), rgba(26, 58, 50, 0.6)),
                        url('https://images.unsplash.com/photo-1545465241-ac4d5285fb7f?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
        .profile-card:hover { transform: translateY(-8px); border-color: #1A3A32; }
        .profile-card.active { background: #1A3A32; color: white; border-color: #1A3A32; }
        @media (max-width: 1024px) {
            .login-split { grid-template-columns: 1fr; }
            .visual-side { display: none; }
        }
    </style>
</head>
<body class="bg-gavac-bg font-jakarta antialiased">
    <div class="login-split">
        <!-- Visual Side -->
        <div class="visual-side flex flex-col justify-center p-20 text-white">
            <h1 class="text-8xl font-extrabold tracking-tighter mb-6">GAVAC</h1>
            <p class="text-3xl font-light opacity-90 leading-tight">Tecnología inteligente <br> para la gestión del campo.</p>
        </div>

        <!-- Form Side -->
        <div class="form-side bg-white flex flex-col justify-center px-12 lg:px-24 py-20">
            <div class="max-w-xl w-full mx-auto">

                <!-- Paso Único: Login -->
                <div id="login-container" class="animate-in fade-in slide-in-from-bottom-4 duration-500">
                    <header class="mb-10">
                        <h2 id="form-title" class="text-4xl font-extrabold text-gavac-primary mb-2">Bienvenido</h2>
                        <p id="form-subtitle" class="text-slate-500 font-medium text-lg">Ingresa tus credenciales para acceder.</p>
                    </header>

                    <form id="loginForm" class="space-y-6">
                        <div class="space-y-2">
                            <label class="text-sm font-bold text-slate-700 ml-1">Correo Electrónico</label>
                            <input type="email" id="email" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-5 outline-none focus:bg-white focus:ring-4 focus:ring-gavac-primary/5 transition-all" placeholder="usuario@gavac.pro">
                        </div>

                        <div id="roleSelectorContainer" class="hidden space-y-4">
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-slate-700 ml-1">Nombre de tu Ganadería / Organización</label>
                                <input type="text" id="org-name-input" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-5 outline-none focus:bg-white focus:ring-4 focus:ring-gavac-primary/5 transition-all" placeholder="Ej: Ganadería El Porvenir">
                            </div>
                            <input type="hidden" id="selected-rol-input" value="admin">
                        </div>

                        <div class="space-y-2">
                            <label class="text-sm font-bold text-slate-700 ml-1">Contraseña</label>
                            <input type="password" id="password" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-5 outline-none focus:bg-white focus:ring-4 focus:ring-gavac-primary/5 transition-all" placeholder="••••••••">
                        </div>

                        <button type="submit" id="submitBtn" class="w-full bg-gavac-primary text-white py-5 rounded-2xl font-extrabold text-lg shadow-xl shadow-gavac-primary/20 hover:bg-gavac-accent transition-all active:scale-95">
                            Entrar al Sistema
                        </button>
                    </form>

                    <div class="mt-8 text-center">
                        <a href="#" id="toggleMode" class="text-sm font-bold text-gavac-primary hover:text-gavac-accent transition-all border-b-2 border-gavac-primary/10 pb-1">¿No tienes cuenta? Regístrate aquí</a>
                    </div>
                </div>

                <div id="loginMessage" class="mt-8 hidden p-5 rounded-2xl text-center text-sm font-bold"></div>
            </div>
        </div>
    </div>

    <script type="module" src="dist/modules/auth/main.js"></script>
    <script>
        if (window.lucide) { lucide.createIcons(); }
    </script>
</body>
</html>
