<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAVAC Admin — Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F1F5F9; color: #0F172A; }
        .serif { font-family: 'DM Serif Display', serif; }
        .sidebar { width: 280px; background: #0F172A; position: fixed; height: 100vh; color: white; border-right: 1px solid rgba(255,255,255,0.05); }
        .main-view { margin-left: 280px; padding: 40px; }
        .kpi-card { background: white; border-radius: 20px; padding: 24px; border: 1px solid #E2E8F0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .board-card {
            background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid #CBD5E1;
            transition: all 0.3s; cursor: grab;
        }
        .board-card:hover { transform: translateY(-3px) rotate(0.5deg); box-shadow: 0 10px 20px rgba(0,0,0,0.05); border-color: #10B981; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-radius: 12px; color: #94A3B8; font-weight: 700; transition: 0.2s; cursor: pointer; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { border-left: 4px solid #10B981; border-radius: 0 12px 12px 0; }
    </style>
</head>
<body class="flex">

    <!-- Sidebar Enterprise -->
    <aside class="sidebar p-6 flex flex-col">
        <div class="flex items-center gap-4 mb-12">
            <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center font-black text-xl shadow-xl">G</div>
            <span class="serif text-2xl tracking-tighter">GAVAC <small class="block text-[8px] font-black text-emerald-500 uppercase tracking-widest">Admin</small></span>
        </div>

        <nav class="flex-1 space-y-3">
            <div class="nav-item active"><span>01</span> Dashboard</div>
            <div class="nav-item"><span>02</span> Mis Fincas</div>
            <a href="/empleados" class="nav-item"><span>03</span> Personal</a>
            <div class="nav-item"><span>04</span> Permisos</div>
        </nav>

        <div class="mt-auto pt-6 border-t border-slate-800">
            <a href="/dashboard" class="flex items-center justify-center gap-2 bg-emerald-900/40 hover:bg-emerald-800 p-4 rounded-2xl text-[10px] font-black tracking-widest uppercase transition-all">
                ← Volver al Inicio
            </a>
        </div>
    </aside>

    <!-- Content -->
    <main class="main-view flex-1">
        <header class="flex justify-between items-end mb-12">
            <div>
                <h1 class="serif text-5xl text-slate-900">Centro de Comando</h1>
                <p class="text-slate-400 font-bold uppercase tracking-widest text-[10px] mt-2">Monitoreo Global de Activos Ganaderos</p>
            </div>
            <button class="bg-emerald-800 text-white px-8 py-3 rounded-xl font-bold shadow-lg hover:bg-emerald-900 transition-all text-xs uppercase tracking-widest">+ Registrar Finca</button>
        </header>

        <!-- Métricas Reales -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-12">
            <div class="kpi-card">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Ganado Total</p>
                <h4 class="text-4xl font-black text-slate-800" id="stat-ganado">...</h4>
            </div>
            <div class="kpi-card">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Leche Hoy (Lts)</p>
                <h4 class="text-4xl font-black text-emerald-600" id="stat-leche">...</h4>
            </div>
            <div class="kpi-card">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Fincas</p>
                <h4 class="text-4xl font-black text-slate-800" id="stat-fincas">...</h4>
            </div>
            <div class="kpi-card">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Alertas</p>
                <h4 class="text-4xl font-black text-red-500" id="stat-alertas">...</h4>
            </div>
        </div>

        <h2 class="serif text-3xl mb-8 text-slate-800">Estado de Operaciones</h2>
        <div class="flex gap-8 overflow-x-auto pb-10" id="board-container">
            <!-- Dinámico -->
            <p class="text-slate-400 italic">Cargando tablero táctico...</p>
        </div>
    </main>

    <script type="module">
        async function fetchDashboard() {
            const token = localStorage.getItem('gavac_token');
            const headers = { 'Authorization': `Bearer ${token}` };
            try {
                const resStats = await fetch('/api/admin/dashboard-stats', { headers });
                const stats = await resStats.json();
                document.getElementById('stat-ganado').textContent = stats.ganado_total;
                document.getElementById('stat-leche').textContent = stats.leche_hoy_lts;
                document.getElementById('stat-fincas').textContent = stats.fincas_activas;
                document.getElementById('stat-alertas').textContent = stats.alertas_salud;

                const resBoard = await fetch('/api/admin/board-data', { headers });
                const board = await resBoard.json();
                const container = document.getElementById('board-container');
                container.innerHTML = board.map(f => `
                    <div class="w-80 flex-shrink-0 bg-slate-200/50 p-4 rounded-2xl">
                        <h5 class="font-black text-[10px] text-slate-500 uppercase tracking-widest mb-4">${f.nombre}</h5>
                        <div>${f.tareas.map(t => `
                            <div class="board-card">
                                <p class="text-[9px] font-black text-emerald-600 uppercase mb-1">${t.categoria}</p>
                                <p class="text-sm font-bold text-slate-800">${t.titulo}</p>
                            </div>
                        `).join('')}</div>
                    </div>
                `).join('') || '<p class="text-slate-400 italic">Sin datos registrados.</p>';
            } catch (e) { console.error(e); }
        }
        document.addEventListener('DOMContentLoaded', fetchDashboard);
    </script>
</body>
</html>
