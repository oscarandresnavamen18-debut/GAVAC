<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAVAC — Inventario Estratégico</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* CSS MAESTRO - ESTILO LANDING PREMIUM */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background-color: #F7F4EF; color: #1A1A14; line-height: 1.6; }

        /* Layout */
        .app-layout { display: flex; min-height: 100vh; }

        /* Sidebar Navigation */
        .sidebar {
            width: 280px; background: #0F172A; position: fixed; height: 100vh; color: white; padding: 40px 24px;
            display: flex; flex-direction: column; z-index: 100;
        }
        .sidebar-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 48px; }
        .logo-box { width: 40px; height: 40px; background: #1B5E20; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 20px; }

        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-radius: 12px;
            color: #94A3B8; text-decoration: none; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s;
        }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { border-left: 4px solid #1B5E20; border-radius: 0 12px 12px 0; }

        /* Main Content */
        .main-content { margin-left: 280px; flex: 1; padding: 60px 8%; }
        .page-header { margin-bottom: 48px; display: flex; justify-content: space-between; align-items: flex-end; }
        .page-header h1 { font-family: 'DM Serif Display', serif; font-size: 48px; line-height: 1; }

        /* Premium Components */
        .card-panel { background: white; border-radius: 24px; padding: 40px; border: 1px solid rgba(0,0,0,0.06); box-shadow: 0 18px 45px rgba(27, 94, 32, 0.05); }

        .input-group { margin-bottom: 24px; }
        .label { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: #6F6F61; margin-bottom: 8px; }
        .input {
            width: 100%; padding: 14px 18px; border-radius: 12px; border: 1px solid #D8D3C7; background: #F8F9FA;
            font-size: 14px; transition: 0.3s; outline: none;
        }
        .input:focus { border-color: #1B5E20; background: white; box-shadow: 0 0 0 4px rgba(27, 94, 32, 0.08); }

        .btn-green {
            width: 100%; background: linear-gradient(90deg, #1B5E20 0%, #2E7D32 100%); color: white;
            padding: 16px; border-radius: 12px; border: none; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; box-shadow: 0 10px 20px rgba(27, 94, 32, 0.2); transition: 0.3s;
        }
        .btn-green:hover { transform: translateY(-2px); box-shadow: 0 15px 35px rgba(27, 94, 32, 0.3); }

        /* Table */
        .table-wrap { overflow: hidden; border-radius: 20px; border: 1px solid #E2E8F0; background: white; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #FAFBFC; padding: 20px 24px; font-size: 11px; font-weight: 900; text-transform: uppercase; color: #64748B; letter-spacing: 1px; border-bottom: 1px solid #E2E8F0; }
        td { padding: 18px 24px; border-bottom: 1px solid #F1F5F9; font-size: 14px; }
        .tr-hover:hover { background: #F8FAFC; }

        .badge { padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .badge-active { background: #DCFCE7; color: #15803D; }

        .delete-link { color: #B42318; text-decoration: none; font-weight: 700; cursor: pointer; }
        .delete-link:hover { text-decoration: underline; }

        @media (max-width: 1024px) { .sidebar { width: 80px; padding: 40px 10px; } .sidebar span { display: none; } .main-content { margin-left: 80px; } }
    </style>
</head>
<body>

    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <div class="logo-box">G</div>
                <span class="serif" style="font-size: 24px; color: white;">GAVAC</span>
            </div>

            <nav style="flex: 1;">
                <a href="/dashboard" class="nav-item"><span>📊</span> <span>Dashboard</span></a>
                <a href="/ganado" class="nav-item active"><span>🐄</span> <span>Inventario</span></a>
                <a href="/reportes" class="nav-item"><span>📈</span> <span>Analítica</span></a>
                <a href="/admin" class="nav-item"><span>🛡️</span> <span>Administración</span></a>
            </nav>

            <div style="border-top: 1px solid rgba(255,255,255,0.05); pt: 20px;">
                <button id="logoutBtn" style="background:rgba(255,255,255,0.05); border:none; color:white; width:100%; padding:12px; border-radius:10px; font-weight:700; cursor:pointer;">SALIR</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="page-header">
                <div>
                    <div style="width: 60px; height: 3px; background: #1B5E20; margin-bottom: 20px;"></div>
                    <h1>Inventario <br><em>Estratégico.</em></h1>
                </div>
                <div style="text-align: right;">
                    <p style="font-size: 12px; font-weight: 800; color: #1B5E20; text-transform: uppercase;">Estado del Sistema</p>
                    <p style="font-size: 14px; font-weight: 500;">Hacienda El Recreo — Online</p>
                </div>
            </header>

            <div style="display: grid; grid-template-columns: 1fr 2.5fr; gap: 40px; align-items: flex-start;">
                <!-- Registration Form -->
                <section class="card-panel">
                    <h3 class="serif" style="font-size: 24px; margin-bottom: 30px;">Nuevo Activo</h3>
                    <form id="animal-form">
                        <div class="input-group">
                            <label class="label">Identificación (Tag)</label>
                            <input id="tag" name="tag" type="text" required class="input" placeholder="GAV-001">
                        </div>
                        <div class="input-group">
                            <label class="label">Raza Genética</label>
                            <input id="breed" name="breed" type="text" class="input" placeholder="Ej: Brahman">
                        </div>
                        <div class="input-group">
                            <label class="label">Género</label>
                            <select id="sex" name="sex" class="input" style="background: #F8F9FA;">
                                <option value="hembra">Hembra</option>
                                <option value="macho">Macho</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label class="label">Fecha Nacimiento</label>
                            <input id="birth_date" name="birth_date" type="date" class="input">
                        </div>
                        <button type="submit" class="btn-green">Registrar Activo</button>
                    </form>
                    <p id="form-error" style="color:#B42318; font-size:12px; margin-top:15px; text-align:center; font-weight:700;"></p>
                </section>

                <!-- Data Table -->
                <section>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Tag</th>
                                    <th>Raza</th>
                                    <th>Género</th>
                                    <th>Nacimiento</th>
                                    <th>Estado</th>
                                    <th style="text-align: right;">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="animal-table-body">
                                <!-- JS Managed -->
                            </tbody>
                        </table>
                    </div>
                    <div id="empty-state" style="text-align: center; padding: 100px 0; display: none;">
                        <p class="serif" style="font-size: 32px; color: #D8D3C7;">Sin activos registrados</p>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script type="module" src="/static/dist/modules/ganado/main.js"></script>
</body>
</html>
