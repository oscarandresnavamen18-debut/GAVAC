<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GAVAC Inventory — Enterprise Management</title>
  <link href="/static/dist/output.css" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;700&display=swap">
  <style>
    body { font-family: 'DM Sans', sans-serif; background-color: #F1F5F9; color: #0F172A; }
    .font-serif { font-family: 'DM Serif Display', serif; }

    /* Header & Navigation */
    .top-nav { background: #0F172A; border-bottom: 1px solid #1E293B; }
    .nav-link { color: #94A3B8; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; transition: all 0.3s; }
    .nav-link:hover, .nav-link.active { color: #F8FAFC; }
    .nav-link.active { border-bottom: 2px solid #10B981; }

    /* Component Styling */
    .card-pro {
        background: white;
        border-radius: 20px;
        border: 1px solid #E2E8F0;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        transition: transform 0.3s ease;
    }
    .input-pro {
        width: 100%;
        background: #F8FAFC;
        border: 1px solid #E2E8F0;
        border-radius: 12px;
        padding: 12px 16px;
        font-size: 0.875rem;
        transition: all 0.2s;
    }
    .input-pro:focus {
        background: white;
        border-color: #10B981;
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        outline: none;
    }
    .btn-pro {
        background: linear-gradient(135deg, #1B5E20 0%, #2E7D32 100%);
        color: white;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 12px 24px;
        border-radius: 12px;
        transition: all 0.3s;
        box-shadow: 0 10px 20px rgba(27, 94, 32, 0.2);
    }
    .btn-pro:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 30px rgba(27, 94, 32, 0.3);
        opacity: 0.95;
    }

    /* Table Styling */
    .table-header { background: #F8FAFC; text-transform: uppercase; font-size: 11px; font-weight: 800; color: #64748B; letter-spacing: 0.05em; }
    .table-row { border-bottom: 1px solid #F1F5F9; transition: background 0.2s; }
    .table-row:hover { background: #F8FAFC; }
  </style>
</head>
<body class="min-h-screen">

  <!-- Header Enterprise -->
  <header class="top-nav text-white sticky top-0 z-50 px-8 py-4">
    <div class="max-w-[1600px] mx-auto flex items-center justify-between">
      <div class="flex items-center gap-4">
        <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center font-bold text-xl shadow-lg shadow-emerald-900/40">G</div>
        <div>
          <h1 class="font-serif text-xl leading-tight">GAVAC Inventory</h1>
          <p class="text-[9px] font-black text-slate-500 uppercase tracking-[0.2em]">Asset Management System</p>
        </div>
      </div>

      <nav class="flex items-center gap-10">
        <a href="/dashboard" class="nav-link">Inicio</a>
        <a href="/ganado" class="nav-link active pb-1">Inventario</a>
        <a href="/reportes" class="nav-link pb-1">Reportes</a>
        <a href="/admin" class="nav-link pb-1">Consola Admin</a>
      </nav>

      <div class="flex items-center gap-5">
        <div class="flex items-center gap-2 px-3 py-1.5 bg-slate-800/50 rounded-full border border-slate-700/50">
            <span id="api-status-dot" class="w-2 h-2 rounded-full bg-slate-500"></span>
            <span id="api-status-text" class="text-[10px] font-bold text-slate-400">...</span>
        </div>
        <button id="logoutBtn" class="text-slate-500 hover:text-red-400 transition-colors">
          <svg viewBox="0 0 24 24" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-[1400px] mx-auto px-8 py-12">

    <div class="grid grid-cols-1 xl:grid-cols-4 gap-10">

      <!-- Form Section (Sidebar style) -->
      <aside class="xl:col-span-1">
        <section class="card-pro p-8 sticky top-28">
          <h2 class="font-serif text-2xl mb-6 text-slate-800">Alta de Registro</h2>
          <form id="animal-form" class="space-y-5">
            <div>
              <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2" for="tag">Identificador (Tag)</label>
              <input id="tag" name="tag" type="text" required placeholder="GAV-000" class="input-pro" />
            </div>
            <div>
              <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2" for="breed">Raza Genética</label>
              <input id="breed" name="breed" type="text" placeholder="Ej: Brahman" class="input-pro" />
            </div>
            <div>
              <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2" for="sex">Género</label>
              <select id="sex" name="sex" class="input-pro bg-white">
                <option value="">Seleccionar...</option>
                <option value="hembra">Hembra</option>
                <option value="macho">Macho</option>
              </select>
            </div>
            <div>
              <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2" for="birth_date">Fecha Nacimiento</label>
              <input id="birth_date" name="birth_date" type="date" class="input-pro" />
            </div>
            <div class="pt-4">
              <p id="form-error" class="text-red-500 text-[11px] font-bold mb-3"></p>
              <button type="submit" class="btn-pro w-full">Registrar Activo</button>
            </div>
          </form>
        </section>
      </aside>

      <!-- Table Section (Main View) -->
      <div class="xl:col-span-3 space-y-8">

        <!-- Filters Header -->
        <section class="bg-white rounded-2xl border border-slate-200 p-6 flex flex-wrap gap-4 items-center justify-between shadow-sm">
          <div class="flex flex-wrap gap-4">
            <input id="filter-tag" type="text" placeholder="Buscar por TAG..." class="input-pro !py-2 !w-48" />
            <input id="filter-breed" type="text" placeholder="Filtrar por Raza..." class="input-pro !py-2 !w-48" />
            <button id="filter-btn" class="bg-slate-900 text-white px-6 py-2 rounded-xl text-xs font-black uppercase tracking-widest hover:bg-emerald-600 transition-all">Filtrar</button>
            <button id="clear-filter-btn" class="text-slate-400 hover:text-slate-900 text-xs font-bold transition-all px-2">Limpiar</button>
          </div>
          <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest">
            Visualizando Registros en Tiempo Real
          </div>
        </section>

        <!-- Main Data Table -->
        <section class="card-pro overflow-hidden">
          <table class="w-full text-sm">
            <thead class="table-header">
              <tr>
                <th class="px-6 py-4 text-left">Identificador</th>
                <th class="px-6 py-4 text-left">Raza</th>
                <th class="px-6 py-4 text-left">Género</th>
                <th class="px-6 py-4 text-left">Nacimiento</th>
                <th class="px-6 py-4 text-left">Estado</th>
                <th class="px-6 py-4 text-right">Acciones</th>
              </tr>
            </thead>
            <tbody id="animal-table-body" class="divide-y divide-slate-50">
              <!-- JS Injected -->
            </tbody>
          </table>
          <div id="empty-state" class="text-center py-32 hidden">
            <img src="https://cdn-icons-png.flaticon.com/512/2620/2620612.png" class="w-20 mx-auto opacity-10 mb-6" alt="Empty">
            <p class="text-slate-400 font-serif text-xl">Sin activos registrados en el inventario</p>
          </div>
        </section>
      </div>

    </div>

    <footer class="text-center text-[10px] font-black text-slate-400 tracking-[0.3em] uppercase pt-20 pb-10">
      GAVAC Enterprise Asset Management — © 2026
    </footer>
  </main>

  <script type="module" src="/static/dist/modules/ganado/main.js"></script>
</body>
</html>
