<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAVAC — Gestión de Inventario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; color: #1E293B; }
        .font-serif { font-family: 'DM Serif Display', serif; }
        .sidebar { background: #0F172A; width: 280px; position: fixed; height: 100vh; color: white; border-right: 1px solid rgba(255,255,255,0.05); }
        .main-content { margin-left: 280px; padding: 40px; }
        .card-ganadero { background: white; border-radius: 20px; border: 1px solid #E2E8F0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); transition: all 0.3s; }
        .card-ganadero:hover { transform: translateY(-3px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); }
        .input-pro { width: 100%; background: #F1F5F9; border: 1px solid #E2E8F0; border-radius: 12px; padding: 12px 16px; transition: all 0.2s; }
        .input-pro:focus { background: white; border-color: #10B981; outline: none; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1); }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-radius: 12px; color: #94A3B8; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { border-left: 4px solid #10B981; border-radius: 0 12px 12px 0; }
    </style>
</head>
<body class="flex">

    <!-- Sidebar Enterprise -->
    <aside class="sidebar p-6 flex flex-col">
        <div class="flex items-center gap-3 mb-12">
            <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center font-bold text-xl shadow-lg">G</div>
            <h1 class="font-serif text-2xl tracking-tighter text-white">GAVAC</h1>
        </div>

        <nav class="flex-1 space-y-2">
            <a href="/dashboard" class="nav-item text-decoration-none"><span>📊</span> Dashboard</a>
            <a href="/ganado" class="nav-item active text-decoration-none"><span>🐄</span> Inventario</a>
            <a href="/reportes" class="nav-item text-decoration-none"><span>📈</span> Analítica</a>
            <a href="/admin" class="nav-item text-decoration-none"><span>🛡️</span> Administración</a>
        </nav>

        <div class="mt-auto pt-6 border-t border-slate-800">
            <button id="logoutBtn" class="w-full bg-red-500/10 hover:bg-red-500 text-red-500 hover:text-white p-3 rounded-xl text-xs font-bold transition-all">CERRAR SESIÓN</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content flex-1">
        <header class="flex justify-between items-end mb-12">
            <div>
                <h2 class="font-serif text-4xl text-slate-900">Control de Activos</h2>
                <p class="text-slate-400 font-medium uppercase tracking-[0.2em] text-[10px] mt-1">Hacienda El Recreo — Inventario Real</p>
            </div>
            <div class="flex items-center gap-4 px-4 py-2 bg-emerald-50 rounded-full border border-emerald-100">
                <span id="api-status-dot" class="w-2 h-2 rounded-full bg-emerald-500"></span>
                <span id="api-status-text" class="text-[10px] font-black text-emerald-700 uppercase">Sistema Online</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- Formulario Sidebar -->
            <section class="lg:col-span-1">
                <div class="card-ganadero p-8 sticky top-10">
                    <h3 class="font-serif text-xl mb-6">Nuevo Animal</h3>
                    <form id="animal-form" class="space-y-4">
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">N.° Chapeta</label>
                            <input id="tag" name="tag" type="text" required class="input-pro" placeholder="GAV-001">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Raza</label>
                            <input id="breed" name="breed" type="text" class="input-pro" placeholder="Ej: Brahman">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Sexo</label>
                            <select id="sex" name="sex" class="input-pro">
                                <option value="hembra">Hembra</option>
                                <option value="macho">Macho</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full bg-[#1B5E20] hover:bg-[#2E7D32] text-white py-4 rounded-xl font-bold shadow-lg transition-all mt-4 uppercase text-xs tracking-widest">Registrar Activo</button>
                    </form>
                </div>
            </section>

            <!-- Tabla de Datos -->
            <section class="lg:col-span-3 space-y-6">
                <div class="card-ganadero overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 border-b border-slate-100 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                            <tr>
                                <th class="px-8 py-5">TAG</th>
                                <th class="px-8 py-5">RAZA</th>
                                <th class="px-8 py-5">GÉNERO</th>
                                <th class="px-8 py-5">ESTADO</th>
                                <th class="px-8 py-5 text-right">ACCIONES</th>
                            </tr>
                        </thead>
                        <tbody id="animal-table-body" class="divide-y divide-slate-50 text-sm">
                            <!-- Inyectado por main.ts -->
                        </tbody>
                    </table>
                    <div id="empty-state" class="hidden text-center py-20 opacity-30">
                        <p class="font-serif text-2xl">No hay registros en esta sección</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script type="module" src="/static/dist/modules/ganado/main.js"></script>
</body>
</html>
