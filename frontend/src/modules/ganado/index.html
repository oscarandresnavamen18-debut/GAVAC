<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GAVAC — Registro de Ganado</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap">
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.4s ease-out both; }
    .delay-1 { animation-delay: 0.04s; }
    .delay-2 { animation-delay: 0.08s; }
    .delay-3 { animation-delay: 0.12s; }

    body {
      font-family: "DM Sans", sans-serif;
      background:
        radial-gradient(circle at top right, rgba(200, 230, 201, 0.3), transparent 30%),
        linear-gradient(135deg, #F7F4EF 0%, #EAF3DE 100%);
      color: #1A1A14;
      min-height: 100vh;
    }

    .brand-mark {
      background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 100%);
    }

    .btn-primary {
      background: linear-gradient(90deg, #1b5e20 0%, #2e7d32 100%);
      box-shadow: 0 4px 14px rgba(27, 94, 32, 0.25);
      transition: all 0.2s ease;
      border: none;
      color: white;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(27, 94, 32, 0.35);
      opacity: 0.9;
    }

    .card-ganadero {
      background: white;
      border-radius: 18px;
      border: 1px solid rgba(0, 0, 0, 0.05);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
    }

    h1, h2, h3 {
      font-family: 'DM Serif Display', serif;
    }

    nav a {
      color: #4A4A40;
      transition: color 0.2s;
    }
    nav a:hover, nav a.active {
      color: #1B5E20;
    }
    nav a.active {
      border-bottom: 2px solid #1B5E20;
    }

    .icon {
      stroke: currentColor;
      fill: none;
      stroke-width: 1.6;
    }

    /* Fallback styles in case Tailwind fails to load */
    input, select, button {
      font-family: inherit;
    }
    .field-input {
      display: block;
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 0.375rem;
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
    }
    .btn-primary {
      display: inline-block;
      padding: 0.5rem 1.25rem;
      border-radius: 0.375rem;
      border: none;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      color: white;
      background-color: #1c4d33; /* Respaldo de color */
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      text-align: left;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #e2e8f0;
      background: #f8fafc;
    }
    td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #f1f5f9;
    }
    nav {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }
    nav a {
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      color: #64748b;
    }
    nav a.active {
      color: #1c4d33;
      border-bottom: 2px solid #1c4d33;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body class="min-h-screen text-slate-700">

  <header class="border-b border-slate-200 bg-white sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="brand-mark w-9 h-9 rounded-lg flex items-center justify-center text-white text-sm font-semibold">G</div>
        <div class="hidden sm:block">
          <h1 class="text-base font-bold text-slate-900 leading-tight">GAVAC</h1>
          <p class="text-slate-500 text-[10px]">Gestión Ganadera</p>
        </div>
      </div>

      <nav>
        <a href="/ganado" class="active">Inventario</a>
        <a href="/reportes">Reportes</a>
        <a href="/admin">Admin</a>
      </nav>

      <div class="flex items-center gap-3">
        <div class="hidden md:flex flex-col items-end">
          <div class="flex items-center gap-1.5">
            <span id="api-status-dot" class="w-2 h-2 rounded-full bg-slate-300"></span>
            <span id="api-status-text" class="text-[10px] font-bold text-slate-500 uppercase">Conectando</span>
          </div>
        </div>
        <button id="logoutBtn" class="text-slate-400 hover:text-red-600 transition-colors">
          <svg viewBox="0 0 24 24" class="icon w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="max-w-5xl mx-auto px-6 py-8">

    <!-- Formulario de registro con estilo Landing -->
    <section class="card-ganadero p-8 mb-8 fade-in delay-1">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-2 h-8 bg-emerald-600 rounded-full"></div>
        <h2 class="font-bold text-xl text-slate-900">Registro de Animales</h2>
      </div>

      <form id="animal-form" class="grid grid-cols-1 sm:grid-cols-2 gap-x-5 gap-y-4">
        <div>
          <label class="block text-xs font-medium mb-1.5 text-slate-500 tracking-wide" for="tag">N.° CHAPETA</label>
          <input id="tag" name="tag" type="text" required
                 class="field-input w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-medium mb-1.5 text-slate-500 tracking-wide" for="breed">RAZA</label>
          <input id="breed" name="breed" type="text"
                 class="field-input w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-medium mb-1.5 text-slate-500 tracking-wide" for="sex">SEXO</label>
          <select id="sex" name="sex"
                  class="field-input w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none bg-white">
            <option value="">Selecciona</option>
            <option value="hembra">Hembra</option>
            <option value="macho">Macho</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium mb-1.5 text-slate-500 tracking-wide" for="birth_date">FECHA DE NACIMIENTO</label>
          <input id="birth_date" name="birth_date" type="date"
                 class="field-input w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none" />
        </div>
        <div class="sm:col-span-2 flex items-center justify-between pt-2 border-t border-slate-100 mt-1">
          <p id="form-error" class="text-red-600 text-xs"></p>
          <button type="submit"
                  class="btn-primary text-white text-sm font-medium px-5 py-2 rounded-md">
            Registrar
          </button>
        </div>
      </form>
    </section>

    <!-- Filtros con estilo Landing -->
    <section class="bg-white/50 backdrop-blur-sm rounded-2xl border border-slate-200 p-5 mb-6 flex flex-wrap gap-4 items-end fade-in delay-2">
      <div>
        <label class="block text-xs font-medium mb-1.5 text-slate-500 tracking-wide" for="filter-tag">BUSCAR POR TAG</label>
        <input id="filter-tag" type="text" placeholder="VACA-001"
               class="field-input border border-slate-300 rounded-md px-3 py-1.5 text-sm focus:outline-none" />
      </div>
      <div>
        <label class="block text-xs font-medium mb-1.5 text-slate-500 tracking-wide" for="filter-breed">RAZA</label>
        <input id="filter-breed" type="text" placeholder="Holstein"
               class="field-input border border-slate-300 rounded-md px-3 py-1.5 text-sm focus:outline-none" />
      </div>
      <button id="filter-btn"
              class="bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium px-4 py-1.5 rounded-md transition-colors">
        Filtrar
      </button>
      <button id="clear-filter-btn"
              class="text-slate-500 hover:text-slate-800 text-sm px-2 py-1.5 transition-colors">
        Limpiar
      </button>
    </section>

    <!-- Tabla con estilo Landing -->
    <section class="card-ganadero overflow-hidden fade-in delay-3">
      <table class="w-full text-sm">
        <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide">
          <tr>
            <th class="text-left px-4 py-3 font-medium">Tag</th>
            <th class="text-left px-4 py-3 font-medium">Raza</th>
            <th class="text-left px-4 py-3 font-medium">Sexo</th>
            <th class="text-left px-4 py-3 font-medium">Nacimiento</th>
            <th class="text-left px-4 py-3 font-medium">Estado</th>
            <th class="text-left px-4 py-3 font-medium">Acciones</th>
          </tr>
        </thead>
        <tbody id="animal-table-body" class="divide-y divide-slate-100">
          <!-- filas insertadas por main.ts -->
        </tbody>
      </table>
      <div id="empty-state" class="text-center text-slate-400 text-sm py-10 hidden">
        No hay animales registrados todavía.
      </div>
    </section>

    <footer class="text-center text-xs text-slate-400 pt-8 pb-4">
      GAVAC — Sistema de Registro de Ganado
    </footer>
  </div>

  <script type="module" src="/static/dist/modules/ganado/main.js"></script>
</body>
</html>
