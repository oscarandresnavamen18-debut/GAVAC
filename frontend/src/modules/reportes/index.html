<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAVAC — Reportes</title>
    <link rel="stylesheet" href="/dist/output.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .app-layout { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
        .sidebar { background-color: #1A3A32; color: white; display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0; }
        .nav-link {
            display: flex; align-items: center; gap: 14px; padding: 14px 24px; border-radius: 16px;
            color: rgba(255,255,255,0.6); text-decoration: none; font-weight: 600; transition: all 0.3s;
        }
        .nav-link:hover { color: white; background: rgba(255,255,255,0.05); }
        .nav-link.active { background: #E8F1EC; color: #1A3A32; }

        @media (max-width: 1024px) {
            .app-layout { grid-template-columns: 80px 1fr; }
            .sidebar span { display: none; }
            .sidebar { padding: 20px 10px; align-items: center; }
        }
    </style>
</head>
<body class="bg-gavac-bg font-jakarta antialiased text-gavac-primary">
    <div class="app-layout">
        <aside class="sidebar p-8">
            <div class="flex items-center gap-3 mb-12 px-2">
                <span class="text-4xl font-extrabold tracking-tighter">GAVAC</span>
            </div>
            <nav class="flex-1 space-y-3" id="main-nav">
                <a href="../../../dashboard.html" class="nav-link" data-module="inicio"><i data-lucide="layout-dashboard" class="w-6 h-6 opacity-70"></i><span>Inicio</span></a>
                <a href="../ganado/index.html" class="nav-link" data-module="animales"><i data-lucide="layout-grid" class="w-6 h-6 opacity-70"></i><span>Animales</span></a>
                <a href="../sanidad/index.html" class="nav-link" data-module="sanidad"><i data-lucide="shield-plus" class="w-6 h-6 opacity-70"></i><span>Sanidad</span></a>
                <a href="../reproduccion/index.html" class="nav-link" data-module="reproduccion"><i data-lucide="heart" class="w-6 h-6 opacity-70"></i><span>Reproducción</span></a>
                <a href="../produccion/index.html" class="nav-link" data-module="produccion"><i data-lucide="droplets" class="w-6 h-6 opacity-70"></i><span>Producción</span></a>
                <a href="../inventario/index.html" class="nav-link" data-module="inventario"><i data-lucide="package" class="w-6 h-6 opacity-70"></i><span>Inventario</span></a>
                <a href="index.html" class="nav-link active" data-module="reportes"><i data-lucide="bar-chart-3" class="w-6 h-6 opacity-70"></i><span>Reportes</span></a>
                <a href="../admin/index.html" class="nav-link" data-module="admin"><i data-lucide="shield-check" class="w-6 h-6 opacity-70"></i><span>Admin</span></a>
            </nav>
            <div class="mt-auto pt-8 border-t border-white/10">
                <button id="logoutBtn" class="flex items-center gap-3 w-full py-4 px-6 rounded-2xl bg-white/5 hover:bg-red-500/10 hover:text-red-400 transition-all font-bold text-sm text-white">
                    <i data-lucide="log-out" class="w-5 h-5 opacity-70"></i>
                    <span>Cerrar sesión</span>
                </button>
            </div>
        </aside>

        <main class="p-10 lg:p-16">
            <header class="flex justify-between items-end mb-12">
                <div>
                    <h1 class="text-4xl font-extrabold mb-2 text-gavac-primary">Reportes</h1>
                    <p class="text-slate-500 font-medium text-lg">Consulta y genera reportes de tu finca</p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="bg-white border border-slate-200 rounded-2xl px-6 py-3 flex items-center gap-3 shadow-sm">
                        <i data-lucide="calendar" class="w-5 h-5 text-slate-400"></i>
                        <span class="text-sm font-bold text-slate-600">01/07/2026 - 31/07/2026</span>
                    </div>
                    <button class="bg-gavac-primary text-white px-6 py-3 rounded-xl font-bold">Generar reporte</button>
                </div>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 mb-12">
                <div class="card-gavac hover:-translate-y-2 transition-all cursor-pointer group">
                    <div class="w-12 h-12 bg-slate-50 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-gavac-primary transition-colors">
                        <i data-lucide="shopping-cart" class="w-6 h-6 text-gavac-primary group-hover:text-white"></i>
                    </div>
                    <h3 class="font-extrabold mb-2">Inventario de animales</h3>
                    <p class="text-sm text-slate-400">Listado completo del ganado por finca y lote.</p>
                </div>
                <!-- Repetir estructura para otros -->
            </div>
        </main>
    </div>

    <script type="module" src="../../../dist/modules/reportes/main.js"></script>
    <script>
        if (window.lucide) { lucide.createIcons(); }

        const userData = JSON.parse(localStorage.getItem('gavac_usuario') || '{}');
        const navLinks = document.querySelectorAll('#main-nav .nav-link');
        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                const moduleName = link.getAttribute('data-module');
                if (moduleName === 'inicio' || userData.rol === 'admin') return;

                if (userData.permisos && userData.permisos[moduleName] === false) {
                    e.preventDefault();
                    alert("Este módulo está deshabilitado para tu perfil. Comunícate con el administrador.");
                }
            });
        });

        document.getElementById('logoutBtn')?.addEventListener('click', () => {
            localStorage.removeItem("gavac_token");
            localStorage.removeItem("gavac_usuario");
            window.location.href = "../../../index.html";
        });
    </script>
</body>
</html>
