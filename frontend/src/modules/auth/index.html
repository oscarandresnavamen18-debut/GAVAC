<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GAVAC - Acceso al Sistema</title>

    <link href="/static/dist/output.css" rel="stylesheet">
</head>

<body class="bg-slate-900 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">

        <!-- LOGO / ENCABEZADO -->

        <div class="text-center mb-8">

            <div
                class="bg-emerald-800 w-16 h-16 rounded-xl mx-auto flex items-center justify-center text-white text-2xl font-bold mb-4">

                G

            </div>

            <h1 class="text-2xl font-bold text-slate-800">
                GAVAC
            </h1>

            <p class="text-slate-500">
                Gestión Ganadera Profesional
            </p>

        </div>


        <!-- FORMULARIO -->

        <form id="loginForm" class="space-y-6">

            <!-- EMAIL -->

            <div>

                <label
                    class="block text-sm font-medium text-slate-700 mb-1">

                    Email Corporativo

                </label>

                <input
                    type="email"
                    id="email"
                    required
                    class="w-full border border-slate-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-emerald-800 outline-none transition-all">

            </div>


            <!-- PASSWORD -->

            <div>

                <label
                    class="block text-sm font-medium text-slate-700 mb-1">

                    Contraseña

                </label>

                <input
                    type="password"
                    id="password"
                    required
                    class="w-full border border-slate-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-emerald-800 outline-none transition-all">

            </div>


            <!-- BOTÓN -->

            <button
                type="submit"
                id="submitBtn"
                class="w-full bg-emerald-800 text-white font-bold py-3 rounded-lg hover:bg-emerald-900 transition-colors shadow-lg">

                Iniciar Sesión

            </button>

        </form>


        <!-- REGISTRO -->

        <p class="mt-4 text-center text-sm text-slate-500">

            <a
                href="#"
                id="toggleMode"
                class="text-emerald-800 font-medium hover:underline">

                ¿No tienes cuenta? Regístrate

            </a>

        </p>


        <!-- MENSAJE -->

        <div
            id="loginMessage"
            class="mt-4 text-center text-sm font-medium hidden">

        </div>


        <!-- FOOTER -->

        <p
            class="mt-8 text-center text-slate-400 text-xs uppercase tracking-widest">

            Protocolo de seguridad activo

        </p>

    </div>


    <!-- JAVASCRIPT COMPILADO -->

    <script
        type="module"
        src="/static/dist/modules/auth/main.ts">
    </script>

</body>

</html>
