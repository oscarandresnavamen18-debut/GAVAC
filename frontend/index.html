<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAVAC - Acceso al Sistema</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap">
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background:
                radial-gradient(circle at top right, rgba(200, 230, 201, 0.4), transparent 30%),
                radial-gradient(circle at bottom left, rgba(234, 243, 222, 0.5), transparent 30%),
                linear-gradient(135deg, #F7F4EF 0%, #EAF3DE 100%);
            color: #1A1A14;
            min-height: 100vh;
        }
        .login-card {
            background: white;
            border-radius: 24px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 25px 60px rgba(27, 94, 32, 0.12);
            backdrop-filter: blur(10px);
        }
        .login-title {
            font-family: 'DM Serif Display', serif;
            font-size: 42px;
            color: #1A1A14;
        }
        .btn-gradient {
            background: linear-gradient(90deg, #1b5e20 0%, #2e7d32 100%);
            box-shadow: 0 10px 24px rgba(27, 94, 32, 0.22);
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(27, 94, 32, 0.3);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">
    <div class="login-card p-10 w-full max-w-md fade-in">
        <div class="text-center mb-10">
            <div class="w-20 h-20 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl font-bold mb-4 shadow-xl"
                 style="background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 100%);">
                G
            </div>
            <h1 class="login-title font-bold tracking-tight">GAVAC</h1>
            <p class="text-slate-500 font-medium">Gestión Ganadera Profesional</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-widest mb-2">Email Corporativo</label>
                <input type="email" id="email" required placeholder="admin@gavac.com"
                       class="w-full border border-slate-200 rounded-xl px-4 py-3.5 focus:ring-4 focus:ring-emerald-600/10 focus:border-emerald-600 outline-none transition-all">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-widest mb-2">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••"
                       class="w-full border border-slate-200 rounded-xl px-4 py-3.5 focus:ring-4 focus:ring-emerald-600/10 focus:border-emerald-600 outline-none transition-all">
            </div>
            <button type="submit" id="submitBtn" class="w-full btn-gradient text-white font-bold py-4 rounded-xl shadow-lg mt-4">
                ENTRAR AL PANEL
            </button>
        </form>

        <p class="mt-4 text-center text-sm text-slate-500">
            <a href="#" id="toggleMode" class="text-emerald-800 font-medium hover:underline">¿No tienes cuenta? Regístrate</a>
        </p>
        <div id="loginMessage" class="mt-4 text-center text-sm font-medium hidden"></div>
    </div>

    <script type="module" src="/static/dist/modules/auth/main.js"></script>
</body>
</html>
