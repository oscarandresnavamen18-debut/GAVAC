concurrency: name: Repo Audit

on:
  push:
    branches: [ main, master, feature/reporte ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auditoría de estructura del repositorio
        run: |
          set -e
          echo "Iniciando auditoría de repositorio"
          missing=0

          check_required() {
            if [ ! -e "$1" ]; then
              echo "MISSING: $1"
              missing=1
            else
              echo "OK: $1"
            fi
          }

          check_optional() {
            if [ ! -e "$1" ]; then
              echo "WARN: falta $1"
            else
              echo  "OK: $1"
            fi
          }

          check_required frontend/package.json
          check_required README.md
          check_required .gitignore
          check_required frontend/src
          check_required frontend/src/modules

          if [ "$missing" -eq 1 ]; then
            echo "AUDITORÍA FALLIDA: faltan archivos obligatorios."
            exit 1
          fi
          echo "Auditoría completada con éxito."
